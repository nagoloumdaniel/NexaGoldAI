# CI NexaGold — lint, typecheck et tests SANS broker, sans base de données et
# sans secrets. Ce workflow ne doit JAMAIS : se connecter à un compte réel,
# envoyer un ordre, utiliser des identifiants, promouvoir un modèle.
name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  engine:
    name: Moteur Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/engine/requirements.lock
      # Installation reproductible depuis le lockfile. MetaTrader5 est marqué
      # win32-only : ignoré sous Linux, le module broker bascule sur son
      # chemin "sans broker".
      - run: pip install -r requirements.lock
      - run: python -m ruff check app tests tests_manual
      - run: python -m compileall -q app
      - run: python -m pytest -q

  api:
    name: API NestJS (tsc + eslint + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      # Génère le client Prisma (src/generated est hors git) — aucune
      # connexion à une base n'est nécessaire pour `generate`.
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npm test -- --runInBand

  web:
    name: Dashboard Next.js (lint + typecheck + ui-text)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ui-text

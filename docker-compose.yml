# Infrastructure locale : PostgreSQL + Redis uniquement.
# Le moteur de trading ne peut PAS être conteneurisé : il dépend du terminal
# MetaTrader 5 installé sous Windows (C:\Program Files\MetaTrader 5) et du
# paquet Python MetaTrader5, Windows-only. Il tourne nativement (start.ps1).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexagold
      POSTGRES_PASSWORD: nexagold
      POSTGRES_DB: nexagold
    ports:
      # 5433 côté hôte : 5432 est déjà pris par un autre projet local
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # 6380 côté hôte : 6379 est déjà pris par un autre projet local
      - "6380:6379"

volumes:
  pgdata:
